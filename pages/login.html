<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Qubit</title>
    <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #fff;
            font-family: 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            width: 100vw;
            min-height: 100vh;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-width: 100vw;
        }
        .login-main {
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 0 4px 0;
            background: #fff;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .login-content {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 8px;
            box-sizing: border-box;
        }
        .login-title {
            text-align: center;
            color: #000;
            font-size: 2rem;
            font-family: Inter, sans-serif;
            font-weight: 600;
            line-height: 2.5rem;
            margin-bottom: 24px;
            margin-top: 0;
            width: 100%;
        }
        .login-subtitle-block {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            margin-bottom: 10px;
        }
        .login-subtitle-main {
            text-align: center;
            color: #000;
            font-size: 1.1rem;
            font-family: Inter, sans-serif;
            font-weight: 600;
            line-height: 1.5rem;
            word-break: break-word;
        }
        .login-subtitle-desc {
            text-align: center;
            color: #000;
            font-size: 0.92rem;
            font-family: Inter, sans-serif;
            font-weight: 400;
            line-height: 1.1rem;
            word-break: break-word;
        }
        .login-main-form-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .login-fields-block {
            width: 100%;
            max-width: 340px;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 14px;
            display: flex;
        }
        .login-input-wrap {
            width: 100%;
            max-width: 340px;
            height: 48px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            box-sizing: border-box;
            margin-left: auto;
            margin-right: auto;
        }
        .login-input {
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            background: #fff;
            outline: none;
            width: 100%;
            height: 100%;
            font-size: 14px;
            font-family: Inter, sans-serif;
            font-weight: 400;
            color: #222;
            line-height: 19.6px;
            padding: 0 16px;
            margin: 0;
            box-shadow: none;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        .login-input:focus,
        .login-input:active {
            outline: none !important;
            box-shadow: none !important;
            border: 1px solid #E0E0E0 !important;
            border-width: 1px !important;
            background-clip: padding-box;
            caret-color: #222;
            transition: none !important;
            transform: none !important;
        }
        .login-input::placeholder {
            color: #828282;
            font-size: 14px;
            font-family: Inter, sans-serif;
            font-weight: 400;
            line-height: 19.6px;
            opacity: 1;
        }
        .login-btn {
            width: 100%;
            max-width: 340px;
            height: 48px;
            padding: 0 16px;
            background: #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: auto;
            margin-right: auto;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }
        .login-btn span {
            color: #fff;
            font-size: 14px;
            font-family: Inter, sans-serif;
            font-weight: 500;
            line-height: 19.6px;
            word-break: break-word;
        }
        .login-btn:active {
            background: #222;
        }
        .login-already-block {
            width: 100%;
            max-width: 216px;
            height: 18px;
            text-align: center;
            font-size: 12px;
            font-family: Inter, sans-serif;
            font-weight: 400;
            line-height: 18px;
            color: #555;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -20px auto 0 auto;
        }
        .login-already-block .login-link {
            font-weight: 700;
            color: #000;
            margin-left: 2px;
            text-decoration: underline;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }
        .login-divider-row {
            width: 100%;
            max-width: 300px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            margin-right: auto;
            margin-top: 4px;
            margin-bottom: 4px;
        }
        .login-divider {
            flex: 1 1 0;
            height: 1px;
            background: #E6E6E6;
        }
        .login-or {
            text-align: center;
            color: #828282;
            font-size: 14px;
            font-family: Inter, sans-serif;
            font-weight: 400;
            line-height: 19.6px;
            word-break: break-word;
            padding: 0 8px;
        }
        .login-social-btn {
            width: 100%;
            max-width: 340px;
            height: 48px;
            position: relative;
            background: #EEEEEE;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-bottom: 4px;
            margin-top: 0;
            padding: 0;
            transition: background 0.2s;
            margin-left: auto;
            margin-right: auto;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }
        .login-social-btn:last-of-type {
            margin-bottom: 0;
        }
        .login-social-content {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .login-social-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-social-label {
            color: #000;
            font-size: 14px;
            font-family: Inter, sans-serif;
            font-weight: 500;
            line-height: 19.6px;
            word-break: break-word;
            display: flex;
            align-items: center;
        }
        .login-terms-block {
            width: 100%;
            max-width: 300px;
            margin: 6px auto 6px auto;
            text-align: center;
            font-size: 12px;
            font-family: Inter, sans-serif;
            font-weight: 400;
            line-height: 18px;
            color: #828282;
            align-self: center;
        }
        .login-terms-block .terms-link {
            color: #000;
            font-weight: 400;
            text-decoration: underline;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            tap-highlight-color: transparent;
        }
        #emailErrorMessage {
            color: #d32f2f;
            font-size: 12px;
            text-align: center;
            margin-top: 2px;
            margin-bottom: 0;
            width: 100%;
            min-height: 16px;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
        }
        @media (max-width: 480px) {
            .login-content {
                max-width: 100vw;
                padding: 0 8px;
            }
            .login-fields-block, .login-divider-row, .login-social-btn, #emailErrorMessage, .login-terms-block {
                max-width: 100vw;
            }
        }
        .fade-out {
            opacity: 0;
            transition: opacity 0.4s cubic-bezier(.4,0,.2,1);
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(0.93); }
            100% { transform: scale(1); }
        }
        .login-btn:active, .login-social-btn:active {
            animation: pop 0.18s cubic-bezier(.4,0,.2,1);
            outline: none !important;
            box-shadow: none !important;
        }
        .login-btn:focus, .login-social-btn:focus {
            outline: none !important;
            box-shadow: none !important;
        }
        .login-link,
        .terms-link {
            text-decoration: underline;
            transition: text-decoration-color 0.18s, color 0.18s;
            text-decoration-color: #000;
        }
        .login-link.underline-fade,
        .terms-link.underline-fade {
            text-decoration-color: transparent;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="login-main">
        <div class="login-content">
            <div class="login-title">Welcome To Qubit</div>
            <div class="login-subtitle-block">
                <div class="login-subtitle-main">Log In To Continue</div>
                <div class="login-subtitle-desc">Enter your email or username and password to <b>login</b></div>
            </div>
            <div class="login-main-form-area">
                <form id="myForm" style="width: 100%;" novalidate autocomplete="off">
                    <div class="login-fields-block">
                        <div class="login-input-wrap">
                            <input type="text" id="emailAddress" class="login-input" placeholder="email@domain.com or Username" required autocomplete="off">
                        </div>
                        <div class="login-input-wrap">
                            <input type="password" id="password" class="login-input" placeholder="Password" required autocomplete="off">
                        </div>
                        <button type="submit" class="login-btn"><span>Continue</span></button>
                    </div>
                    <div id="emailErrorMessage"></div>
                </form>
                <div class="login-already-block" style="margin-top: 20px;">
                    <span>Not already a member? </span><a href="/pages/signup.html" id="signupLink" class="login-link">Sign Up</a>
                </div>
                <div class="login-divider-row">
                    <div class="login-divider"></div>
                    <div class="login-or">or</div>
                    <div class="login-divider"></div>
                </div>
                <button class="login-social-btn" type="button">
                    <div class="login-social-content">
                        <span class="login-social-icon">
                            <!-- Google SVG recreation -->
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <g>
                                    <path d="M19.6 10.23c0-.68-.06-1.36-.18-2H10v3.79h5.48a4.68 4.68 0 01-2.03 3.07v2.55h3.28c1.92-1.77 3.03-4.38 3.03-7.41z" fill="#4285F4"/>
                                    <path d="M10 20c2.7 0 4.97-.89 6.63-2.41l-3.28-2.55c-.91.61-2.07.97-3.35.97-2.57 0-4.75-1.74-5.53-4.07H1.09v2.56A9.99 9.99 0 0010 20z" fill="#34A853"/>
                                    <path d="M4.47 12.94A5.99 5.99 0 014.09 10c0-.51.09-1.01.15-1.49V5.95H1.09A9.99 9.99 0 000 10c0 1.64.39 3.19 1.09 4.55l3.38-2.61z" fill="#FBBC05"/>
                                    <path d="M10 4.01c1.47 0 2.78.51 3.81 1.5l2.85-2.85C14.97 1.13 12.7.01 10 .01A9.99 9.99 0 001.09 5.95l3.38 2.56C5.25 5.75 7.43 4.01 10 4.01z" fill="#EA4335"/>
                                </g>
                            </svg>
                        </span>
                        <span class="login-social-label">Continue with Google</span>
                    </div>
                </button>
                <button class="login-social-btn" type="button">
                    <div class="login-social-content">
                        <span class="login-social-icon">
                            <!-- Apple SVG icon -->
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M16.365 10.98c-.02-2.13 1.74-3.15 1.82-3.2-1-1.47-2.56-1.67-3.11-1.7-1.32-.13-2.58.77-3.25.77-.67 0-1.7-.75-2.8-.73-1.44.02-2.77.84-3.51 2.13-1.5 2.6-.38 6.45 1.07 8.56.71 1.03 1.56 2.18 2.68 2.14 1.08-.04 1.49-.69 2.8-.69 1.31 0 1.68.69 2.81.67 1.16-.02 1.89-1.05 2.59-2.08.82-1.19 1.16-2.34 1.18-2.4-.03-.01-2.26-.87-2.29-3.45zm-2.7-6.3c.6-.73 1-1.75.89-2.77-.86.03-1.89.57-2.5 1.3-.55.65-1.04 1.7-.86 2.7.95.07 1.87-.48 2.47-1.23z" fill="#000"/>
                            </svg>
                        </span>
                        <span class="login-social-label">Continue with Apple</span>
                    </div>
                </button>
                <div class="login-terms-block">
                    By clicking continue, you agree to our <a href="#" class="terms-link">Terms of Service</a> and <a href="#" class="terms-link">Privacy Policy</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="/scripts/server.js"></script>
    <script type="module" src="/scripts/login.js"></script>
    <script>
        // Smooth fade transition for signup link
        document.querySelectorAll('.login-link, .terms-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                link.classList.add('underline-fade');
                setTimeout(() => {
                    link.classList.remove('underline-fade');
                    window.location.href = link.href;
                }, 180);
            });
        });
    </script>
</body>
</html>
