    <script src="https://kit.fontawesome.com/ada7aee952.js" crossorigin="anonymous"></script>
    <style>
        /* White and orange theme override */
        html, body, form, .main-container, .content {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
        
        * {
            color: #000000;
        }
        
        input {
            background-color: #FFFFFF;
            border: 1px solid #E0E0E0;
            color: #000000;
        }
        
        h1, h2, h3, p, a, span, div {
            color: #000000;
        }
        
        #button {
            background-color: #FFFFFF;
            color: #220952ff;
            border: 2px solid #220952ff;
        }
        
        /* Add these styles to fix button hover animations */
        button:hover, .btn:hover, .add-page-btn:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        .sidebar a:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        .sidebar a:hover i {
            color: #220952ff !important;
        }
        
        /* Fix button hover animation */
        @keyframes buttonHover {
            0% {
                background-color: #FFFFFF;
                color: #220952ff;
            }
            100% {
                background-color: #220952ff;
                color: #FFFFFF;
            }
        }
        
        #button:hover {
            background-color: #220952ff !important;
            color: #FFFFFF !important;
            box-shadow: 0 6px 12px rgba(253, 90, 35, 0.3) !important;
            transform: translateY(-2px);
            animation: none; /* Remove any existing animations */
            transition: all 0.3s ease;
        }
        
        /* Fix folder header hover */
        .folder-header:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        /* Fix collapse button hover */
        .collapse-btn:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        /* Add this to fix sidebar background */
        .sidebar {
            background-color: #FFFFFF !important;
            border-right: 1px solid #eee !important;
        }
        
        .signup-text {
            color: #000000;
        }
        
        .signup-link {
            color: #220952ff;
        }
        
        .signup-link:hover {
            color: #FF7A4D;
        }
        
        .already {
            color: #000000;
        }
        
        .already a {
            color: #220952ff;
        }
        
        .already a:hover {
            color: #FF7A4D;
        }
        
        /* Add this to fix sidebar background */
        .sidebar {
            background-color: #FFFFFF !important;
            border-right: 1px solid #eee !important;
        }
    </style>
</head>

        <div class="sidebarmenu">
            <a class="collapser" id="collapser">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
    
            <div class="linker">
                <div class="links">
                    <a href="/pages/"><i class="fa-solid fa-search"></i></a>
                    <a href="/pages/"><i class="fa-solid fa-robot"></i></a>
                    <a href="/pages/"><i class="fa-solid fa-home"></i></a>

                    <a href="/pages/chats.html"><i class="fa-solid fa-inbox"></i></a>

                </div>
            </div>
            <div class="cover" id="coverscreen121"></div>
            <div class="sirvo" id="sirvo">




                <div class="mener">
                    <a id="closer"><i class="fa-solid fa-xmark"></i></a>
                    <div class="linksmener" id="linksmener">
                        

                        <a><i class="fa-solid fa-search"> <h1>Search</h1></i> </a>

    <link rel="stylesheet" href="/style/menu.css">
        
    <script src="/scripts/menu.js"></script>

    <div class="main-container" id="mainContainer">
        <!-- Pages Divider -->
        <div class="pages-divider">
            <div class="pages-header">
            </div>
            <div class="divider"></div>
        </div>
        
        <div class="content" id="content">
            <div class="wrapper">
                <div class="title">Login</div>
                <form id="myForm" novalidate>
                    <div class="field">
                        <input type="text" id="emailAddress" required>
                        <label>Email/Username</label>
                    </div>
                    <div class="field">
                        <input type="password" id="password" required>
                        <label>Password</label>
                    </div>
                    <div class="field">
                        <input type="submit" value="Login">
                    </div>
                    <div class="signup-link">
                        Not already a member? <a href="/pages/signup.html">Sign Up</a>
                    </div>
                </form>
                <div style="width:100%;text-align:center;margin-top:8px;font-size:20px;font-family:'RF Dewi',sans-serif;font-weight:700;background: linear-gradient(90deg, #ff7a4d 0%, #220952ff 100%);-webkit-background-clip: text;-webkit-text-fill-color: transparent;">Welcome Back !</div>
                <div id="emailErrorMessage" class="error" style="margin-top:400px;font-size:12px;padding:4px;"></div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="/scripts/server.js"></script>
    <script type="module" src="/scripts/login.js"></script>
    <script src="/scripts/animations.js"></script>
    <script src="/scripts/sidebar.js"></script>
    <!-- Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
      // If user comes from signup, trigger confetti
      if (localStorage.getItem('fromSignup')) {
        confetti({
          particleCount: 150,
          spread: 90,
          origin: { y: 0.1 },
        });
        localStorage.removeItem('fromSignup');
      }
    </script>
