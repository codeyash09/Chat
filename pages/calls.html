        async function getMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

            } catch (err) {

        }

        async function getCallMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
            } catch (err) {
                console.error('Media error:', err);
            }
          

            document.getElementById(`videoFallback`).style.display = 'flex';
            document.getElementById(`videoFallback`).children[0].textContent = userId.charAt(0).toUpperCase();
            document.getElementById('localVideo').parentElement.children[1].style.marginTop = "20px";
         

            
            const stream = localStream;
            const audioCtx = new AudioContext();
            const analyser = audioCtx.createAnalyser();
            const source = audioCtx.createMediaStreamSource(stream);
            source.connect(analyser);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            const aura = document.getElementById("soundAura");

            function animateAura() {
                analyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;

                // Adjust scale based on volume
                const scale = Math.min(1 + avg / 100, 2);
                aura.style.transform = `scale(${scale})`;
                aura.style.opacity = `${Math.min(avg / 100, 1)}`;

                requestAnimationFrame(animateAura);
            }

            animateAura();
        }

        async function sendMessage(type, data, targetUser = null) {
            await sb.from('webrtc_signals').insert({
                type: type,
                payload: data,
                sender_id: userId,
                receiver_id: targetUser,
                room_id: roomId
            });
        }

        function createPeerConnection(remoteUserId) {
            const pc = new RTCPeerConnection(config);

            iceCandidateQueue[remoteUserId] = [];

            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });
            pc.ontrack = (event) => {
                addRemoteVideo(remoteUserId, event.streams[0]);

            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendMessage('ice', event.candidate, remoteUserId);
                }
            };

            peerConnections[remoteUserId] = pc;
            return pc;
        }
        function addRemoteVideo(userId, stream) {
            let video = document.getElementById(`video-${userId}`);
            if (!video) {
                const videoElement = document.createElement('video');
                videoElement.id = `video-${userId}`;
                videoElement.autoplay = true;

                const label = document.createElement('div');
                label.textContent = userId;
                label.classList.add("video-label");

                let placeholder = document.createElement('div');
                placeholder.classList.add('placeholder');
                placeholder.id = `videoFallback${userId}`;
                placeholder.style.display = 'flex';
                let initial = document.createElement('div');
                initial.classList.add('initial');   
                initial.textContent = userId.charAt(0).toUpperCase();
                let aura = document.createElement('div'); 
                aura.classList.add('aura');
                aura.id = `soundAura${userId}`;
                placeholder.appendChild(initial);
                placeholder.appendChild(aura);

                const container = document.createElement('div');
                container.classList.add('video-wrapper');
                container.appendChild(videoElement);
                container.appendChild(label);
                container.appendChild(placeholder);
                document.getElementById('videoGrid').appendChild(container);
                video = videoElement;
            }
            video.srcObject = stream;

            let auraActive = false;
            let audioContext = null;

            function shouldShowVideo() {
                // Create a small canvas to sample the video for brightness detection
                const canvas = document.createElement('canvas');
                canvas.width = 10;
                canvas.height = 10;
                const ctx = canvas.getContext('2d');
                
                try {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // Check if all pixels are black (or very dark)
                    let totalBrightness = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        totalBrightness += data[i] + data[i + 1] + data[i + 2]; // RGB values
                    }
                    
                    const avgBrightness = totalBrightness / (data.length / 4 * 3);
                    return avgBrightness > 15; // Threshold for "not black"
                    
                } catch (error) {
                    console.log('Canvas brightness check failed:', error);
                    return false; // Show fallback if brightness check fails
                }
            }

            function updateVideoDisplay() {
                if((document.getElementById(`videoFallback${userId}`)) && !hangedUp){
                    const showVideo = shouldShowVideo();
                    const placeholder = document.getElementById(`videoFallback${userId}`);
                    video = document.getElementById(`video-${userId}`);

                    const label = video.parentElement.children[1];
                    
                    if (showVideo) {
                        video.style.display = 'block';
                        video.style.height = "308.66667px";
                        placeholder.style.display = 'none';
                        label.style.marginTop = '';
                        
                        auraActive = false;
                        if (audioContext) {
                            if(document.getElementById(`videoFallback${userId}`) && !hangedUp && audioContext.state != 'closed'){
                                audioContext.close();
                                audioContext = null;
                            }
                           
                        }
                    } else {
                        video.style.display = 'block';
                        video.style.height = "250px";

                        placeholder.style.display = 'flex';
                        label.style.marginTop = '20px';
                        
                        setupAudioVisualization();
                    }
                }
                
            }

            function setupAudioVisualization() {
                if (auraActive || !stream.getAudioTracks().length) return;
                
                auraActive = true;
                
                try {
                    audioContext = new AudioContext();
                    const analyser = audioContext.createAnalyser();
                    const source = audioContext.createMediaStreamSource(stream);
                    source.connect(analyser);

                    const dataArray = new Uint8Array(analyser.frequencyBinCount);
                    const aura = document.getElementById(`soundAura${userId}`);

                    function animateAura() {
                        if (!auraActive) return;

                        analyser.getByteFrequencyData(dataArray);
                        const avg = dataArray.reduce((a, b) => a + b) / dataArray.length;

                        const scale = Math.min(1 + avg / 100, 2);
                        aura.style.transform = `scale(${scale})`;
                        aura.style.opacity = `${Math.min(avg / 100, 1)}`;

                        requestAnimationFrame(animateAura);
                    }

                    animateAura();
                } catch (error) {
                    console.error('Audio context error:', error);
                }
            }

            // Listen for video events to detect when video starts/stops
            video.addEventListener('loadedmetadata', updateVideoDisplay);
            video.addEventListener('canplay', updateVideoDisplay);
            video.addEventListener('playing', updateVideoDisplay);
            video.addEventListener('pause', updateVideoDisplay);
            video.addEventListener('emptied', updateVideoDisplay);
            video.addEventListener('stalled', updateVideoDisplay);

            // Monitor for video dimension changes (more frequent check)
            checkInterval = setInterval(() => {
                updateVideoDisplay();
                
                // Clean up if stream is gone
                if (!stream.active && !hangedUp) {
                    clearInterval(checkInterval);
                    if (audioContext) {
                        if(document.getElementById(`videoFallback${userId}`) && !hangedUp && audioContext.state != 'closed'){
                            audioContext.close();
                            audioContext = null;
                        }
                        
                    }
                }
            }, 200); // Check every 200ms

            // Initial setup
            updateVideoDisplay();
        }

        function removeUser(userId) {
            const video = document.getElementById(`video-${userId}`);
            if (video) {
                video.parentElement.remove();
            }

            if (peerConnections[userId]) {
                peerConnections[userId].close();
                delete peerConnections[userId];
            }

            delete iceCandidateQueue[userId];

            participants.delete(userId);
            
        }

       

        async function handleMessage(msg) {
            const { type, payload, sender_id, receiver_id } = msg;

            if (sender_id === userId) return; 
            if (receiver_id && receiver_id !== userId) return; 

            switch (type) {
                case 'user_joined':
                    console.log(`${sender_id} joined`);
                    participants.add(sender_id);
                    
                    await makeOffer(sender_id);
                    break;

                case 'user_left':
                    console.log(`${sender_id} left`);
                    removeUser(sender_id);
                    break;

                case 'offer':
                    await handleOffer(sender_id, payload);
                    break;

                case 'answer':
                    await handleAnswer(sender_id, payload);
                    break;

                case 'ice':
                    await handleIce(sender_id, payload);
                    break;
            }
        }

        async function makeOffer(remoteUserId) {
            const pc = createPeerConnection(remoteUserId);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendMessage('offer', offer, remoteUserId);
        }

        async function handleOffer(remoteUserId, offer) {
            const pc = createPeerConnection(remoteUserId);
            await pc.setRemoteDescription(offer);

            processQueuedCandidates(remoteUserId);

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendMessage('answer', answer, remoteUserId);
        }

        async function handleAnswer(remoteUserId, answer) {
            const pc = peerConnections[remoteUserId];
            if (pc) {
                await pc.setRemoteDescription(answer);

                processQueuedCandidates(remoteUserId);
            }
        }

        function processQueuedCandidates(remoteUserId) {
            const pc = peerConnections[remoteUserId];
            const candidates = iceCandidateQueue[remoteUserId] || [];

            candidates.forEach(candidate => {
                pc.addIceCandidate(candidate).catch(console.error);
            });

            iceCandidateQueue[remoteUserId] = [];
        }

        async function handleIce(remoteUserId, candidate) {
            const pc = peerConnections[remoteUserId];
            if (pc && pc.remoteDescription) {

                await pc.addIceCandidate(candidate);
            } else {

                if (!iceCandidateQueue[remoteUserId]) {
                    iceCandidateQueue[remoteUserId] = [];
                }
                iceCandidateQueue[remoteUserId].push(candidate);
            }
        }

        sb
        .channel('realtime-changes')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'incoming_calls' }, async (payload) => {
            if(payload.new.id == roomId){
                let worthKeeping = 0;
                let newAccept = payload.new.accepted;
                for(let i = 0; i < newAccept.length; i++){
                    if(newAccept[i] >= 0){
                        worthKeeping++;
                    }
                }

                if(worthKeeping <= 1){
                    const { data, error } = await sb
                        .from('incoming_calls')
                        .delete()
                        .eq('id', roomId);

                    await leaveRoom();
                }
            }
        })
        .subscribe((status)=>{
            console.log("Channel Stat: " + status);
        })

        async function leaveRoom() {
            hangedUp = true;
            clearInterval(checkInterval);
            let vids = document.querySelectorAll('video');
            for(let i = 0; i< vids.length; i++){
                let clone = vids[i].cloneNode(true);
                vids[i].replaceWith(clone);
            }
            sendMessage('user_left', { userId });

            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};
            iceCandidateQueue = {};

            participants.clear();
           

            const remoteVideos = document.querySelectorAll('[id^="video-"]:not(#localVideo)');
            remoteVideos.forEach(video => video.parentElement.remove());

            if (supabaseChannel) {
                sb.removeChannel(supabaseChannel);
            }

            document.getElementById('joinBtn').disabled = false;
            document.getElementById('joinBtn2').disabled = false;
            document.querySelector('.media-controls').style.display = "none";
            document.querySelector('.room-controls').style.display = "flex";
            document.querySelector('#videoGrid').style.display = "none";


            document.getElementById('leaveBtn').disabled = true;

            const { data, error } = await sb
                .from('incoming_calls')
                .select('*')
                .eq('id', roomId)
                .single();

            if(data && data.members){
                let num = data.members.indexOf(userId);
                let newAccept = data.accepted;
                newAccept[num] = -1;
                let worthKeeping = 0;
                for(let i = 0; i < newAccept.length; i++){
                    if(newAccept[i] == 1){
                        worthKeeping++;
                    }
                }

                if(worthKeeping > 1){
                    const { data, error } = await sb
                        .from('incoming_calls')
                        .update({ accepted: newAccept, })
                        .eq('id', roomId)
                }else{
                    const { data, error } = await sb
                        .from('incoming_calls')
                        .delete()
                        .eq('id', roomId);
                }


                


                
                    
            }

            


            window.location.replace("/pages/chats.html");

        }

        function toggleVideo() {
            isVideoEnabled = !isVideoEnabled;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = isVideoEnabled;
            }
            const btn = document.getElementById('toggleVideoBtn');
            if (btn) btn.innerHTML = isVideoEnabled ? '<i class="fa-solid fa-video"></i>' : '<i class="fa-solid fa-video-slash"></i>';

            if(isVideoEnabled){
                document.getElementById(`videoFallback`).style.display = 'none';
      
                document.getElementById('localVideo').style.height = "308.66667px";

                document.getElementById('localVideo').parentElement.children[1].removeAttribute('style');
            }else{
                document.getElementById(`videoFallback`).style.display = 'flex';
                
                document.getElementById('localVideo').style.height = "250px";

                document.getElementById('localVideo').parentElement.children[1].style.marginTop = "20px";
            }
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = isAudioEnabled;
            }
            const btn = document.getElementById('toggleAudioBtn');
            if (btn) btn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-microphone"></i>' : '<i class="fa-solid fa-microphone-slash"></i>';
        }

        async function shareScreen() {
            if (!isScreenSharing) {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: true
                    });

                    const videoTrack = screenStream.getVideoTracks()[0];

                    Object.values(peerConnections).forEach(async (pc) => {
                        const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) {
                            await sender.replaceTrack(videoTrack);
                        }
                    });

                    document.getElementById('localVideo').srcObject = screenStream;
                    isScreenSharing = true;

                    const btn = document.getElementById('shareScreenBtn');
                    if (btn) btn.textContent = 'Stop Sharing';

                    videoTrack.addEventListener('ended', () => {
                        stopScreenShare();
                    });

                } catch (error) {
                    console.error('Error sharing screen:', error);
                }
            } else {
                stopScreenShare();
            }
        }

        async function stopScreenShare() {
            const videoTrack = localStream.getVideoTracks()[0];

            Object.values(peerConnections).forEach(async (pc) => {
                const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    await sender.replaceTrack(videoTrack);
                }
            });

            document.getElementById('localVideo').srcObject = localStream;
            isScreenSharing = false;

            const btn = document.getElementById('shareScreenBtn');
            if (btn) btn.innerHTML = '<i class="fa-solid fa-display"></i>';
        }

        document.getElementById('joinBtn').onclick = joinRoom;
        document.getElementById('joinBtn2').onclick = joinRoom2;
        document.getElementById('leaveBtn').addEventListener('click', async()=>{ await leaveRoom(); });


        let urlParams = new URLSearchParams(window.location.search);
        let username = urlParams.get('username');
        let id = urlParams.get('id');
        let mode = urlParams.get('mode');

        if (username && id) {
            document.querySelector('#userInput').value = username;
            document.querySelector("#roomInput").value = id;

            if(mode == "video"){
                joinRoom();

            }else{
                joinRoom2();

            }


            
            window.history.replaceState({}, document.title, window.location.pathname);
        } else {
        
            window.location.replace("/pages/chats.html");
        }

        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const shareScreenBtn = document.getElementById('shareScreenBtn');

        if (toggleVideoBtn) toggleVideoBtn.onclick = toggleVideo;
        if (toggleAudioBtn) toggleAudioBtn.onclick = toggleAudio;
        if (shareScreenBtn) shareScreenBtn.onclick = shareScreen;

    </script>
</body>
</html>
