<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Summit</title>

    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/signup.css">
    <script src="https://kit.fontawesome.com/ada7aee952.js" crossorigin="anonymous"></script>
    <style>
        /* White and orange theme override */
        html, body, form, .main-container, .content {
            background-color: #FFFFFF !important;
            color: #000000 !important;
        }
        
        * {
            color: #000000;
        }
        
        input {
            background-color: #FFFFFF;
            border: 1px solid #E0E0E0;
            color: #000000;
        }
        
        h1, h2, h3, p, a, span, div {
            color: #000000;
        }
        
        #button {
            background-color: #FFFFFF;
            color: #220952ff;
            border: 2px solid #220952ff;
        }
        
        /* Add these styles to fix button hover animations */
        button:hover, .btn:hover, .add-page-btn:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        .sidebar a:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        .sidebar a:hover i {
            color: #220952ff !important;
        }
        
        /* Fix button hover animation */
        @keyframes buttonHover {
            0% {
                background-color: #FFFFFF;
                color: #220952ff;
            }
            100% {
                background-color: #220952ff;
                color: #FFFFFF;
            }
        }
        
        #button:hover {
            background-color: #220952ff !important;
            color: #FFFFFF !important;
            box-shadow: 0 6px 12px rgba(253, 90, 35, 0.3) !important;
            transform: translateY(-2px);
            animation: none; /* Remove any existing animations */
            transition: all 0.3s ease;
        }
        
        /* Fix folder header hover */
        .folder-header:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        /* Fix collapse button hover */
        .collapse-btn:hover {
            background-color: #FFF5F2 !important;
            color: #220952ff !important;
        }
        
        .already {
            color: #000000;
        }
        
        .already a {
            color: #220952ff;
        }
        
        .already a:hover {
            color: #FF7A4D;
        }
        
        /* Add this to fix sidebar background */
        .sidebar {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Sidebar removed for mobile optimization -->
    <div id="meny">
        <div class="sidebarmenu">
            <a class="collapser" id="collapser">
                <i class="fa-solid fa-chevron-right"></i>
            </a>
            <div class="linker">
                <div class="links">
                    <a href="/pages/"><i class="fa-solid fa-search"></i></a>
                    <a href="/pages/"><i class="fa-solid fa-robot"></i></a>
                    <a href="/pages/"><i class="fa-solid fa-home"></i></a>
                    <a href="/pages/chats.html"><i class="fa-solid fa-inbox"></i></a>
                </div>
            </div>
            <div class="cover" id="coverscreen121"></div>
            <div class="sirvo" id="sirvo">
                <div class="mener">
                    <a id="closer"><i class="fa-solid fa-xmark"></i></a>
                    <div class="linksmener" id="linksmener">
                        <a><i class="fa-solid fa-search"> <h1>Search</h1></i> </a>
                        <a><i class="fa-solid fa-robot"> <h1>Summit AI</h1></i></a>
                        <a href="/pages/"><i class="fa-solid fa-home"> <h1>Home</h1></i></a>
                        <a href="/pages/chats.html"><i class="fa-solid fa-inbox"> <h1>Inbox</h1></i></a>
                    </div>
                </div>
                <img src="/images/shadow.png" id="splash2">
                <img src="/images/splasher.png" id="splash">
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="/style/menu.css">
    <script src="/scripts/menu.js"></script>
    <div class="main-container" id="mainContainer">
        <!-- Pages Divider -->
        <div class="pages-divider">
            <div class="pages-header">
            </div>
            <div class="divider"></div>
        </div>
        <div class="content" id="content">
            <div class="wrapper">
                <div class="title">Sign Up</div>
                <form id="myForm" novalidate>
                    <div class="field">
                        <input type="text" id="name" required>
                        <label>Name</label>
                    </div>
                    <div class="field">
                        <input type="email" id="emailAddress" required>
                        <label>Email Address</label>
                    </div>
                    <div class="field">
                        <input type="password" id="password" required>
                        <label>Password</label>
                    </div>
                    <div class="field">
                        <input type="date" id="birthday" required>
                        <label>Birthday</label>
                    </div>
                    <div class="field">
                        <input type="text" id="username" required>
                        <label>Username</label>
                    </div>
                    <div class="field">
                        <input type="submit" value="Sign Up">
                    </div>
                    <div class="signup-link">
                        Already a member? <a href="/pages/login.html" id="loginLink">Log In</a>
                    </div>
                </form>
                <div id="emailErrorMessage" class="error" style="margin-top:425px;font-size:12px;padding:4px;text-align:center;width:300px;margin-left:25px;"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script type="module" src="/scripts/server.js"></script>
    <script type="module" src="/scripts/signup.js"></script>
    <script src="/scripts/animations.js"></script>
    <script>
      // Set flag for confetti when going to login
      document.getElementById('loginLink').addEventListener('click', function() {
        localStorage.setItem('fromSignup', '1');
      });
    </script>
</body>
</html>
