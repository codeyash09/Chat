<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Signup | Qubit</title>
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/signup.css">
  <script src="https://kit.fontawesome.com/ada7aee952.js" crossorigin="anonymous"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #fff;
      font-family: 'Inter', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
    }
    body {
      min-height: 100vh;
      min-width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .signup-main {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 0 4px 0;
      background: #fff;
      box-sizing: border-box;
      overflow-y: auto;
    }
    .signup-content {
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
      box-sizing: border-box;
    }
    .welcome-title {
      text-align: center;
      color: #000;
      font-size: 2rem;
      font-family: Inter, sans-serif;
      font-weight: 600;
      line-height: 2.5rem;
      margin-bottom: 6px;
      margin-top: 0;
      width: 100%;
    }
    .subtitle-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      margin-bottom: 10px;
    }
    .subtitle-block .main {
      text-align: center;
      color: #000;
      font-size: 1.1rem;
      font-family: Inter, sans-serif;
      font-weight: 600;
      line-height: 1.5rem;
      word-break: break-word;
    }
    .subtitle-block .desc {
      text-align: center;
      color: #000;
      font-size: 1rem;
      font-family: Inter, sans-serif;
      font-weight: 400;
      line-height: 1.3rem;
      word-break: break-word;
    }
    .main-form-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .fields-block {
      width: 100%;
      max-width: 340px;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 14px;
      display: flex;
    }
    .input-wrap {
      width: 100%;
      max-width: 340px;
      height: 48px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      box-sizing: border-box;
      margin-left: auto;
      margin-right: auto;
    }
    .input-wrap input {
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      background: #fff;
      outline: none;
      width: 100%;
      height: 100%;
      font-size: 14px;
      font-family: Inter, sans-serif;
      font-weight: 400;
      color: #222;
      line-height: 19.6px;
      padding: 0 16px;
      margin: 0;
      box-shadow: none;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
    }
    .input-wrap input:focus,
    .input-wrap input:active {
      outline: none !important;
      box-shadow: none !important;
      border: 1px solid #E0E0E0 !important;
      border-width: 1px !important;
      background-clip: padding-box;
      caret-color: #222;
      transition: none !important;
      transform: none !important;
    }
    .input-wrap input::placeholder {
      color: #828282;
      font-size: 14px;
      font-family: Inter, sans-serif;
      font-weight: 400;
      line-height: 19.6px;
      opacity: 1;
    }
    .input-wrap input[type="date"]::-webkit-input-placeholder { color: #828282; }
    .input-wrap input[type="date"]::-moz-placeholder { color: #828282; }
    .input-wrap input[type="date"]:-ms-input-placeholder { color: #828282; }
    .input-wrap input[type="date"]::placeholder { color: #828282; }
    input[type=date]::-webkit-inner-spin-button, input[type=date]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .continue-btn {
      width: 100%;
      max-width: 340px;
      height: 48px;
      padding: 0 16px;
      background: #000;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: auto;
      margin-right: auto;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }
    .continue-btn span {
      color: #fff;
      font-size: 14px;
      font-family: Inter, sans-serif;
      font-weight: 500;
      line-height: 19.6px;
      word-break: break-word;
    }
    .continue-btn:active {
      background: #222;
    }
    .already-block {
      width: 100%;
      max-width: 216px;
      height: 18px;
      text-align: center;
      font-size: 12px;
      font-family: Inter, sans-serif;
      font-weight: 400;
      line-height: 18px;
      color: #555;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: -20px auto 0 auto;
    }
    .already-block .login-link {
      font-weight: 700;
      color: #000;
      margin-left: 2px;
      text-decoration: underline;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }
    .divider-row {
      width: 100%;
      max-width: 300px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      margin-right: auto;
      margin-top: 4px;
      margin-bottom: 4px;
    }
    .divider-row .divider {
      flex: 1 1 0;
      height: 1px;
      background: #E6E6E6;
    }
    .divider-row .or {
      text-align: center;
      color: #828282;
      font-size: 14px;
      font-family: Inter, sans-serif;
      font-weight: 400;
      line-height: 19.6px;
      word-break: break-word;
      padding: 0 8px;
    }
    .social-btn {
      width: 100%;
      max-width: 340px;
      height: 48px;
      position: relative;
      background: #EEEEEE;
      border-radius: 8px;
      border: none;
      display: flex;
      align-items: center;
      cursor: pointer;
      margin-bottom: 4px;
      margin-top: 0;
      padding: 0;
      transition: background 0.2s;
      margin-left: auto;
      margin-right: auto;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }
    .social-btn:last-of-type {
      margin-bottom: 0;
    }
    .social-btn .social-content {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .social-btn .social-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .social-btn .social-label {
      color: #000;
      font-size: 14px;
      font-family: Inter, sans-serif;
      font-weight: 500;
      line-height: 19.6px;
      word-break: break-word;
      display: flex;
      align-items: center;
    }
    .terms-block {
      width: 100%;
      max-width: 300px;
      margin: 6px auto 6px auto;
      text-align: center;
      font-size: 12px;
      font-family: Inter, sans-serif;
      font-weight: 400;
      line-height: 18px;
      color: #828282;
      align-self: center;
    }
    .terms-block .terms-link {
      color: #000;
      font-weight: 400;
      text-decoration: underline;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      tap-highlight-color: transparent;
    }
    #emailErrorMessage {
      color: #d32f2f;
      font-size: 12px;
      text-align: center;
      margin-top: 2px;
      margin-bottom: 0;
      width: 100%;
      min-height: 16px;
      max-width: 300px;
      margin-left: auto;
      margin-right: auto;
    }
    @media (max-width: 480px) {
      .signup-content {
        max-width: 100vw;
        padding: 0 8px;
      }
      .fields-block, .divider-row, .social-btn, #emailErrorMessage, .terms-block {
        max-width: 100vw;
      }
    }
    .birthday-mask-wrap {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 48px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 0;
    }
      .birthday-mask-wrap input[type="text"] {
    width: 100%;
    height: 48px;
    border: 1px solid #E0E0E0;
    border-radius: 8px;
    background: transparent;
    font-size: 14px;
    font-family: Inter, sans-serif;
    font-weight: 400;
    color: transparent;
    padding: 0 40px 0 16px;
    box-sizing: border-box;
    outline: none !important;
    box-shadow: none !important;
    transition: none !important;
    transform: none !important;
    position: relative;
    z-index: 2;
    caret-color: transparent;
    letter-spacing: normal;
  }
      .birthday-mask-wrap .birthday-label {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #828282;
    font-size: 14px;
    font-family: Inter, sans-serif;
    font-weight: 400;
    background: #fff;
    padding: 0 4px;
    pointer-events: none;
    transition: 0.15s cubic-bezier(.4,0,.2,1);
    z-index: 3;
  }
  .birthday-mask-wrap input[type="text"]:focus + .birthday-label,
  .birthday-mask-wrap input[type="text"]:not(:placeholder-shown) + .birthday-label {
    opacity: 0;
    visibility: hidden;
  }
      .birthday-mask-wrap .birthday-mask {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #bdbdbd;
    font-size: 14px;
    font-family: Inter, sans-serif;
    font-weight: 400;
    pointer-events: none;
    z-index: 1;
    letter-spacing: normal;
    user-select: none;
    white-space: pre;
    opacity: 0;
    transition: opacity 0.15s;
  }
        .birthday-mask-wrap .birthday-overlay {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #222;
    font-size: 14px;
    font-family: Inter, sans-serif;
    font-weight: 400;
    pointer-events: none;
    z-index: 3;
    letter-spacing: normal;
    user-select: none;
    white-space: pre;
  }
    .birthday-mask-wrap .calendar-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      color: #828282;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .custom-calendar {
      position: absolute;
      top: 54px;
      left: 0;
      z-index: 100;
      background: #fff;
      border: 1px solid #E0E0E0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 12px;
      font-family: Inter, sans-serif;
      font-size: 14px;
      display: none;
    }
    .custom-calendar table {
      border-collapse: collapse;
      width: 100%;
    }
    .custom-calendar th, .custom-calendar td {
      width: 32px;
      height: 32px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .custom-calendar th {
      color: #888;
      font-weight: 500;
    }
    .custom-calendar td:hover {
      background: #f0f0f0;
    }
    .custom-calendar .selected {
      background: #220952ff;
      color: #fff;
    }
    .custom-calendar .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
        .custom-calendar .calendar-header button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #220952ff;
      padding: 0 6px;
    }
    @keyframes blink {
      0%, 50% { color: #bdbdbd; }
      51%, 100% { color: #000; }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(0.93); }
      100% { transform: scale(1); }
    }
    .continue-btn:active, .social-btn:active {
      animation: pop 0.18s cubic-bezier(.4,0,.2,1);
      outline: none !important;
      box-shadow: none !important;
    }
    .continue-btn:focus, .social-btn:focus {
      outline: none !important;
      box-shadow: none !important;
    }
    .login-link,
    .terms-link {
      text-decoration: underline;
      transition: text-decoration-color 0.18s, color 0.18s;
      text-decoration-color: #000;
    }
    .login-link.underline-fade,
    .terms-link.underline-fade {
      text-decoration-color: transparent;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="signup-main">
    <div class="signup-content">
      <div class="welcome-title">Welcome To Qubit</div>
      <div class="subtitle-block">
        <div class="main">Create an account</div>

      <div class="main-form-area">

                  <path d="M10 20c2.7 0 4.97-.89 6.63-2.41l-3.28-2.55c-.91.61-2.07.97-3.35.97-2.57 0-4.75-1.74-5.53-4.07H1.09v2.56A9.99 9.99 0 0010 20z" fill="#34A853"/>
                  <path d="M4.47 12.94A5.99 5.99 0 014.09 10c0-.51.09-1.01.15-1.49V5.95H1.09A9.99 9.99 0 000 10c0 1.64.39 3.19 1.09 4.55l3.38-2.61z" fill="#FBBC05"/>
                  <path d="M10 4.01c1.47 0 2.78.51 3.81 1.5l2.85-2.85C14.97 1.13 12.7.01 10 .01A9.99 9.99 0 001.09 5.95l3.38 2.56C5.25 5.75 7.43 4.01 10 4.01z" fill="#EA4335"/>

        <button class="social-btn" type="button" style="background: #EEEEEE;">
          <div class="social-content">
            <span class="social-icon">
              <!-- Apple SVG icon -->
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M16.365 10.98c-.02-2.13 1.74-3.15 1.82-3.2-1-1.47-2.56-1.67-3.11-1.7-1.32-.13-2.58.77-3.25.77-.67 0-1.7-.75-2.8-.73-1.44.02-2.77.84-3.51 2.13-1.5 2.6-.38 6.45 1.07 8.56.71 1.03 1.56 2.18 2.68 2.14 1.08-.04 1.49-.69 2.8-.69 1.31 0 1.68.69 2.81.67 1.16-.02 1.89-1.05 2.59-2.08.82-1.19 1.16-2.34 1.18-2.4-.03-.01-2.26-.87-2.29-3.45zm-2.7-6.3c.6-.73 1-1.75.89-2.77-.86.03-1.89.57-2.5 1.3-.55.65-1.04 1.7-.86 2.7.95.07 1.87-.48 2.47-1.23z" fill="#000"/>

  <script>
    // Set flag for confetti when going to login
    document.getElementById('loginLink').addEventListener('click', function() {
      localStorage.setItem('fromSignup', '1');
    });
  </script>
  <script>
  (function() {
    const input = document.getElementById('birthday');
    const mask = document.getElementById('birthdayMask');
    const overlay = document.getElementById('birthdayOverlay');
    const calendar = document.getElementById('customCalendar');
    const wrap = document.getElementById('birthday-wrap');

      function formatMask(val) {
    let v = val.replace(/[^0-9]/g, '');
    let mask = 'YYYY-MM-DD';
    
    let result = '';
    let digitIndex = 0;
    let nextBlink = true;
    
    // Check for validation errors for each part
    let yearError = false;
    let monthError = false;
    let dayError = false;
    
    if (v.length >= 4) {
      let year = parseInt(v.slice(0,4));
      if (year < 1850 || year > 2100) yearError = true;
    }
    if (v.length >= 6) {
      let month = parseInt(v.slice(4,6));
      if (month < 1 || month > 12) monthError = true;
    }
    if (v.length >= 8) {
      let day = parseInt(v.slice(6,8));
      if (day < 1 || day > 31) dayError = true;
    }
    
    for (let i = 0; i < mask.length; i++) {
      if (mask[i] === 'Y' || mask[i] === 'M' || mask[i] === 'D') {
        if (digitIndex < v.length) {
          // Determine which part this digit belongs to
          let partIndex = 0;
          if (digitIndex < 4) partIndex = 0; // Year
          else if (digitIndex < 6) partIndex = 1; // Month
          else partIndex = 2; // Day
          
          let isError = false;
          if (partIndex === 0 && yearError) isError = true;
          else if (partIndex === 1 && monthError) isError = true;
          else if (partIndex === 2 && dayError) isError = true;
          
          let color = isError ? '#d32f2f' : '#222';
          result += `<span style="color: ${color};">${v[digitIndex++]}</span>`;
        } else {
          // Only blink the very next character
          if (nextBlink) {
            result += `<span style="animation: blink 1s infinite;">${mask[i]}</span>`;
            nextBlink = false;
          } else {
            result += mask[i];
          }
        }
      } else {
        result += mask[i];
      }
    }
    
    return result;
  }
      function getOverlay(val) {
    let v = val.replace(/[^0-9]/g, '');
    let out = '';
    if (v.length > 0) out += v.slice(0,4);
    if (v.length > 4) out += '-' + v.slice(4,6);
    if (v.length > 6) out += '-' + v.slice(6,8);
    return out;
  }
      input.addEventListener('input', function(e) {
    let v = input.value.replace(/[^0-9]/g, '');
    if (v.length > 8) v = v.slice(0,8);
    
    // Real-time validation as user types
    let formatted = '';
    let cursorPos = input.selectionStart;
    
    if (v.length > 0) {
      let year = v.slice(0,4);
      // Check year in real-time
      if (year.length >= 4) {
        let yearNum = parseInt(year);
        if (yearNum < 1850 || yearNum > 2100) {
          // Invalid year - prevent typing
          v = v.slice(0, 3);
        }
      }
      formatted += year;
    }
    
    if (v.length > 4) {
      let month = v.slice(4,6);
      // Check month in real-time
      if (month.length >= 2) {
        let monthNum = parseInt(month);
        if (monthNum < 1 || monthNum > 12) {
          v = v.slice(0, 5);
        }
      }
      formatted += '-' + month;
    }
    
    if (v.length > 6) {
      let day = v.slice(6,8);
      let month = parseInt(v.slice(4,6));
      let year = parseInt(v.slice(0,4));
      
      // Check day in real-time
      if (day.length >= 2) {
        let dayNum = parseInt(day);
        if (dayNum < 1 || dayNum > 31) {
          v = v.slice(0, 7);
        }
      }
      
      // Full day validation
      if (day.length >= 2) {
        let maxDays = new Date(year, month, 0).getDate();
        if (parseInt(day) < 1 || parseInt(day) > maxDays) {
          v = v.slice(0, 6);
          formatted = formatted.slice(0, -3);
        } else {
          formatted += '-' + day;
        }
      } else {
        formatted += '-' + day;
      }
    }
    
    input.value = formatted;
    mask.innerHTML = formatMask(input.value);
    overlay.textContent = '';
  });
      input.addEventListener('focus', function() {
    mask.style.opacity = 1;
    mask.innerHTML = formatMask(input.value);
    overlay.textContent = '';
  });
      input.addEventListener('blur', function() {
    if (!input.value) {
      mask.style.opacity = 0;
      overlay.textContent = '';
    } else {
      mask.style.opacity = 1;
      mask.innerHTML = formatMask(input.value);
      overlay.textContent = '';
    }
  });
    // Calendar logic (reuse previous custom calendar code)
    let selectedDate = null;
    let currentMonth = null;
    let currentYear = null;
    function pad(n) { return n < 10 ? '0' + n : n; }
    function formatDate(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }
      function parseDate(str) {
    const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    return new Date(+m[1], +m[2]-1, +m[3]);
  }
    function renderCalendar(month, year, selected) {
      currentMonth = month;
      currentYear = year;
      const today = new Date();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      let html = '<div class="calendar-header">'
        + `<button type="button" id="prevMonth">&#8592;</button>`
        + `<span>${firstDay.toLocaleString('default', { month: 'long' })} ${year}</span>`
        + `<button type="button" id="nextMonth">&#8594;</button>`
        + '</div>';
      html += '<table><thead><tr>';
      ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => html += `<th>${d}</th>`);
      html += '</tr></thead><tbody><tr>';
      for(let i=0; i<firstDay.getDay(); i++) html += '<td></td>';
      for(let d=1; d<=lastDay.getDate(); d++) {
        const isSelected = selected && selected.getFullYear() === year && selected.getMonth() === month && selected.getDate() === d;
        html += `<td class="${isSelected ? 'selected' : ''}" data-day="${d}">${d}</td>`;
        if((firstDay.getDay() + d) % 7 === 0) html += '</tr><tr>';
      }
      html += '</tr></tbody></table>';
      calendar.innerHTML = html;
      calendar.style.display = 'block';
      document.getElementById('prevMonth').onclick = function(e) {
        e.stopPropagation();
        renderCalendar(month === 0 ? 11 : month-1, month === 0 ? year-1 : year, selectedDate);
      };
      document.getElementById('nextMonth').onclick = function(e) {
        e.stopPropagation();
        renderCalendar(month === 11 ? 0 : month+1, month === 11 ? year+1 : year, selectedDate);
      };
      calendar.querySelectorAll('td[data-day]').forEach(td => {
        td.onclick = function(e) {
          e.stopPropagation();
          const day = parseInt(td.getAttribute('data-day'));
          selectedDate = new Date(year, month, day);
          input.value = formatDate(year, month, day);
          mask.innerHTML = formatMask(input.value);
          overlay.textContent = '';
          calendar.style.display = 'none';
          input.dispatchEvent(new Event('input', {bubbles:true}));
        };
      });
    }
    document.addEventListener('click', function(e) {
      if (!wrap.contains(e.target)) {
        calendar.style.display = 'none';
      }
    });
  })();
  </script>
  <script>
  document.querySelectorAll('.login-link, .terms-link').forEach(link => {
    link.addEventListener('click', function(e) {
      link.classList.add('underline-fade');
      setTimeout(() => {
        link.classList.remove('underline-fade');
        window.location.href = link.href;
      }, 180);
      e.preventDefault();
    });
  });
  </script>
